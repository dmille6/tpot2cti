# tpot2cti — OUR services only (importer + tunnel + opt-in sidecars).
#
# Per V1_SPEC §2: this is the SECOND compose project on the host.
# OpenCTI itself is deployed via a separate `opencti/docker-compose.yml`
# cloned by setup.sh from OpenCTI-Platform/docker.  We do NOT fork or
# vendor OpenCTI's compose.
#
# Network model:
#   - OpenCTI's compose creates the `opencti_default` network when it
#     comes up.
#   - We attach to it as `external: true` so our services share
#     name-based DNS with opencti, redis, rabbitmq, elasticsearch.
#   - setup.sh's hard rule: bring up OpenCTI first (which creates the
#     network), THEN bring us up.
#
# Profiles:
#   - core (tpot-tunnel + tpot2cti) always run — no profile guard.
#   - tpot2cti-credentials and tpot2cti-vault are opt-in via
#     COMPOSE_PROFILES=credentials,vault (set in .env by setup.sh).
#   - Sidecar source lives in ./tpot2cti-credentials and
#     ./tpot2cti-vault — Phase 8 fills those in.
#
# Host port bindings:
#   - NONE from this compose file.  OpenCTI's UI claims host :8080.
#     Our /health endpoint is reachable from within the docker network
#     as http://tpot2cti:8080/health — not from the host.
#
# See docs/LESSONS_LEARNED_FROM_V0.md §9.1 (cache + new files), §9.2
# (--env-file requirement), §9.3 (restart policy for opt-in services).

name: tpot2cti

services:

  # ---------------------------------------------------------------------------
  # SSH tunnel to T-Pot's Elasticsearch (V1_SPEC §2 data flow).
  # ---------------------------------------------------------------------------
  # Service key is `tunnel` so the importer can reach ES at
  # `tunnel:64298` using the default ES_HOST + ES_PORT in tpot2cti/config.py.
  # Mirroring T-Pot's remote ES port (64298) on the local side avoids the
  # port-translation footgun where core defaults to 64298 but tunnel listens
  # on 9200 — caused a first-install fail until we aligned them.
  tunnel:
    build:
      context: ./tpot-tunnel
      dockerfile: Dockerfile
    image: tpot2cti/tunnel:local
    container_name: tpot2cti-tunnel
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Where the autossh entrypoint listens inside the container.
      # Importer reaches it as tcp://tunnel:64298 on opencti_default.
      TUNNEL_LOCAL_BIND: "0.0.0.0:64298"
    volumes:
      # Read-only mount of the SSH key generated by setup.sh.
      - ./ssh-keys:/ssh-keys:ro
    networks:
      - opencti_default
    healthcheck:
      test: ["CMD-SHELL", "pgrep autossh >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    # Bound the json-file log so a long-running tunnel doesn't fill the
    # host disk. autossh is mostly silent — 5MB × 3 = 15MB is plenty.
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  # Core importer (V1_SPEC §3 cycle).
  # ---------------------------------------------------------------------------
  tpot2cti:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Build-time git SHA surfaces in the startup banner. setup.sh and
        # update.sh export TPOT2CTI_GIT_SHA from `git rev-parse HEAD` so
        # `docker compose build` reads it from the host env via this arg.
        TPOT2CTI_GIT_SHA: ${TPOT2CTI_GIT_SHA:-unknown}
    image: tpot2cti/core:local
    container_name: tpot2cti-core
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      tunnel:
        condition: service_healthy
    volumes:
      # State DB + any per-cycle scratch — main.py defaults to /data/state.db.
      - ./data/tpot2cti:/data
      - ./logs:/var/log/tpot2cti
    networks:
      - opencti_default
    # Per 2026-05-22 logging audit #L2: cap docker-json log size so a
    # multi-week soak can't fill the host disk. 20MB × 5 = 100MB cap;
    # combined with the in-process rotating file handler at /var/log,
    # operators have ~30 days of structured history available.
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    # NO host port mapping.  /health is internal only.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      # First cycle takes a while (ES query + foundation pass + 30s
      # indexing delay + entities + 30s + relationships) — give it
      # plenty of slack before counting failures.
      start_period: 120s

  # ---------------------------------------------------------------------------
  # Optional: credentials analytics sidecar (V1_SPEC §8.1).
  # ---------------------------------------------------------------------------
  # Enabled by setting COMPOSE_PROFILES=credentials in .env.
  # Source/Dockerfile authored in Phase 8; we only declare the service
  # contract here.
  # ── Malware-sample ingestion (optional; profile: malware) ──────────────
  # Imports VT-confirmed malware samples from the hive's `malware-samples`
  # index as File + Indicator + Malware SDOs. Zero third-party API cost — the
  # verdicts already exist. Runs from the SAME image as the core, as its own
  # process, so it can never slow or break the honeypot cycle.
  # See docs/ENRICHMENT.md and docs/ingest/malware.md.
  tpot2cti-malware-ingest:
    build:
      context: .
      dockerfile: Dockerfile
    image: tpot2cti/core:local
    container_name: tpot2cti-malware-ingest
    command: ["python", "-m", "tpot2cti.ingest.malware"]
    profiles: ["malware"]
    env_file: [.env]
    depends_on:
      tpot2cti-tunnel:
        condition: service_healthy
    volumes:
      - ./data/tpot2cti:/data
      - ./logs:/var/log/tpot2cti
    restart: unless-stopped
    networks: [opencti]
    logging:
      driver: "json-file"
      options: {max-size: "10m", max-file: "3"}

  tpot2cti-credentials:
    build:
      context: ./tpot2cti-credentials
      dockerfile: Dockerfile
    image: tpot2cti/credentials:local
    container_name: tpot2cti-credentials
    restart: unless-stopped
    profiles:
      - credentials
    env_file:
      - .env
    depends_on:
      tunnel:
        condition: service_healthy
    volumes:
      - ./data/credentials:/data
      - ./logs:/var/log/tpot2cti
    networks:
      - opencti_default

  # ---------------------------------------------------------------------------
  # Optional: malware vault sidecar (V1_SPEC §8.2).
  # ---------------------------------------------------------------------------
  # Enabled by setting COMPOSE_PROFILES=vault in .env.
  # Needs the SSH key too — it SFTPs sample files off the T-Pot host.
  tpot2cti-vault:
    build:
      context: ./tpot2cti-vault
      dockerfile: Dockerfile
    image: tpot2cti/vault:local
    container_name: tpot2cti-vault
    restart: unless-stopped
    profiles:
      - vault
    env_file:
      - .env
    depends_on:
      tunnel:
        condition: service_healthy
    volumes:
      - ./data/malware-vault:/data
      - ./ssh-keys:/ssh-keys:ro
      - ./logs:/var/log/tpot2cti
    networks:
      - opencti_default

networks:
  # Created by OpenCTI's own compose project — we attach as external.
  # setup.sh asserts this network exists before `docker compose up`.
  opencti_default:
    external: true
    name: opencti_default
