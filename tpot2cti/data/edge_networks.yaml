# tpot2cti — CDN / cloud-edge networks (score ceiling, tpot2cti/score_ceiling.py)
#
# An address in one of these ranges is a CDN EDGE relaying somebody else's
# request (Workers, proxied origins, WARP egress). It is kept as an
# observable with its Sighting, labelled `edge-network:<provider>`, and its
# Indicator/observable score is capped at TPOT2CTI_SCORE_CEILING (default
# 25), so nothing score-gated acts on it. Nothing is dropped.
#
# Rules (the same as benign_scanners.yaml):
#   - ONLY ranges the provider itself publishes as its edge. Never a cloud
#     provider's tenant space (AWS, GCP, Azure, OVH, DigitalOcean): attackers
#     rent VMs there, and capping them would hide exactly the traffic this
#     project exists to collect.
#   - Copy the list verbatim from the URL below and record the date.
#   - Strict: a malformed entry stops startup (ScoreCeilingError).
#
# Measured before adding (v2, 2026-10-03): 36 live Indicators with score
# >= 50 inside Cloudflare's ranges (23 FATT, 11 Suricata, 1 H0neytr4p,
# 1 Galah); 0 inside Fastly's.

