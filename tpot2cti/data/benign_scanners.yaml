# tpot2cti — benign-scanner allowlist
#
# Events from these ASNs / organizations get DROPPED at parse time:
# no Indicator, no IPv4-Addr observable, no Sighting, nothing.
# We don't want to ship Indicators claiming Google's scanners are
# malicious — they're not.
#
# Matching is OR-of-rules:
#   1. event.src_asn in `asns` (integer match) → drop
#   2. any keyword from `org_keywords` is a case-insensitive substring of
#      event.src_as_org → drop
#   3. the address's FORWARD-CONFIRMED reverse-DNS name ends in one of
#      `rdns_suffixes` → drop
#
# Suffix hygiene: list the NARROWEST name a vendor actually scans from, and
# only names observed on live traffic. A broad apex like "censys.io" or
# "onyphe.net" covers every subdomain a vendor will ever publish — including
# ones they abandon, which is subdomain-takeover surface pointed straight at an
# allowlist that DELETES data. Four such apexes were removed after measuring
# zero live matches for any of them.
#
# Why (3) exists: research scanners rent infrastructure. Shadowserver's
# scanners are on Hurricane Electric (AS6939), BinaryEdge's on DigitalOcean
# (AS14061), Stretchoid's on Microsoft (AS8075) — so rules (1) and (2) can
# NEVER match them, even though all three vendors are listed below. Measured
# on the live fleet: 2,731 addresses / 92,127 events over 168h, of which 17
# were labelled `targeted:substantive` — the label meaning "this one got in,
# share it as real intelligence". One of them is a nonprofit.
#
# rDNS matching is FORWARD-CONFIRMED (see tpot2cti/rdns.py): the PTR name is
# resolved back and must return the original address. A bare PTR match would
# be an allowlist anyone could opt into, since the address holder controls
# their own PTR record — publishing "scan-99.shadowserver.io" would be enough
# to disappear from the intelligence. Suffixes match on label boundaries, so
# `evil-shadowserver.io` does not match a `shadowserver.io` rule.
#
# Adding a vendor:
#   - Verify the ASN(s) at https://bgp.he.net/ or https://radar.cloudflare.com/asn
#   - Pull the `org_keywords` from how the ASN's organization name
#     appears in T-Pot's GeoIP enrichment (typically MaxMind ASN org name)
#   - Be CONSERVATIVE — a too-broad keyword silently drops attacker
#     traffic from compromised-but-otherwise-legit organizations
#
# Live data check before adding:
#   from tpot2cti within the container:
#   curl http://tunnel:64298/logstash-*/_search -d '{
#     "size":0,
#     "query":{"term":{"src_ip":"<the-IP-you're-curious-about>"}},
#     "aggs":{"asn":{"terms":{"field":"geoip.asn"}},
#             "org":{"terms":{"field":"geoip.organization.keyword"}}}}'
#
# This file is shipped in-repo and read at startup; no live updates.
# A future enrichment connector can add a dynamic allowlist on top.

scanners:

  google:
    # AS15169 = Google LLC (Googlebot, crawlers)
    # AS396982 = Google Cloud Platform (cloud-hosted scanners, including
    #            internal Google research scanners that hit our T-Pot)
    asns: [15169, 396982]
    org_keywords:
      - "Google LLC"
      - "GOOGLE"
      - "Google Cloud Platform"

  censys:
    # AS398324 = CENSYS-ARIN-01 — internet-wide research scanner
    # https://support.censys.io/hc/en-us/articles/360043177092
    asns: [398324]
    org_keywords:
      - "Censys"
    # Some probes run from rented space.
    rdns_suffixes:
      - "censys-scanner.com"

  shodan:
    # AS208046 = Census of Internet, LLC (Shodan's main scanner ASN)
    # AS20473 = AS-CHOOPA / Vultr (Shodan operates from here partially)
    # NOTE: AS20473 is a hosting provider; broader keyword filtering
    # via org_keywords is more reliable for Shodan than ASN alone.
    asns: [208046]
    org_keywords:
      - "Shodan"
      - "Census of Internet"

  shadowserver:
    # AS33038 = SHADOWSERVER (Shadowserver Foundation — security NPO)
    # https://www.shadowserver.org/what-we-do/network-reporting/
    asns: [33038]
    org_keywords:
      - "Shadowserver"
    # Scans run from Hurricane Electric space (AS6939), not AS33038 — only rDNS identifies them.
    rdns_suffixes:
      - "shadowserver.io"

  internet-archive:
    # AS7941 = INTERNET-ARCHIVE (archive.org's crawlers)
    asns: [7941]
    org_keywords:
      - "Internet Archive"

  # ─── Added after first-live-install cycle 9 analysis ─────────────
  # All five below are documented internet-wide research scanners.
  # Each ASN verified at bgp.he.net before adding; conservative
  # org_keywords to avoid catching unrelated entities on the same AS.

  stretchoid:
    # Stretchoid is a long-running benign scanner network announcing
    # the *.stretchoid.com PTR. Their main ASN is AS62240 but they
    # also lease ranges from other ASes, so the org keyword is the
    # primary catch (their reverse-DNS leaks "stretchoid.com" into
    # the GeoIP org field on most MaxMind databases).
    asns: [62240]
    org_keywords:
      - "Stretchoid"
      - "stretchoid.com"
    # Runs on Microsoft Azure (AS8075).
    rdns_suffixes:
      - "stretchoid.com"

  rapid7-sonar:
    # Project Sonar — Rapid7's internet-wide scan effort (data feeds
    # the Open Data project at opendata.rapid7.com).
    # AS19185 = Rapid7 LLC (corporate)
    # AS62192 = Project Sonar dedicated scanner ASN
    asns: [19185, 62192]
    org_keywords:
      - "Rapid7"
      - "Project Sonar"

  binaryedge:
    # BinaryEdge — paid internet attack-surface scanner (binaryedge.io).
    # AS204904 = BinaryEdge dedicated.
    asns: [204904]
    org_keywords:
      - "BinaryEdge"
      - "BINARYEDGE"
    # Runs on DigitalOcean (AS14061).
    rdns_suffixes:
      - "binaryedge.ninja"

  onyphe:
    # ONYPHE — French internet scan / cyber defense data provider.
    # AS208476 = Onyphe SAS scanner pool.
    asns: [208476]
    org_keywords:
      - "Onyphe"
      - "ONYPHE"
    # Rented space (observed: dunlop.probe.onyphe.net on OVH).
    # Narrow to the probe subdomain, not the apex.
    rdns_suffixes:
      - "probe.onyphe.net"

  net-systems-research:
    # Net Systems Research / "Internet Census of all the things"
    # — academic-style scanners; rDNS reads *.netsystemsresearch.com.
    # AS396355 = LOOKINGGLASS-NSR / Net Systems Research.
    asns: [396355]
    org_keywords:
      - "Net Systems Research"
      - "NETSYSTEMSRESEARCH"
      - "Internet Census"
