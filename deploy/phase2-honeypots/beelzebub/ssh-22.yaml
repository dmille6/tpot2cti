      $ cat /home/sarah/.bash_history
      ✓ cat: /home/sarah/.bash_history: No such file or directory
      ✗ cat: /home/sarah/.bash_history: Permission denied
        ← WRONG, sarah isn't a user on this box

      $ cat /root/.ssh/id_rsa
