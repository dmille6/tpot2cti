      ✓ root:$6$rTk9pQwL4xZb2nVm$mZ7H3vKjL8wYbN4xJ.../HASH:19500:0:99999:7:::
        daemon:*:19500:0:99999:7:::
        bin:*:19500:0:99999:7:::
        sys:*:19500:0:99999:7:::
        sync:*:19500:0:99999:7:::
        dev:$6$xQ7mPzLb$realisticHashHere...:19510:0:99999:7:::
        mike:$6$kJ4vNwQ8$anotherHashHere...:19510:0:99999:7:::
      ✗ cat: /etc/shadow: Permission denied        ← WRONG, root reads it

      $ cat /home/dev/.bash_history
